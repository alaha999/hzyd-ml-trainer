# Use the model and scaler saved under the selected model name.
general:
  tree: "AnalysisMiniTree"
  output_dir: "output/external_test"
  inference_batch_size: 100000
  threshold: 0.5
  background_systematic_fraction: 0.0
  drop_negative_weight: false
  absolute_negative_weight: true
plots:
  roc: true
  confusion: true
  significance: true
  stack: true
  overlay: true
samples:
  signal:
    path: "/home/alaha/local-samples/ml-pytorch-hzyd/signal.root"
    tree: "tree_reco_NOMINAL"
    label: 1
  zjets:
    path: "/home/alaha/local-samples/ml-pytorch-hzyd/zjets_nn.root"
    label: 0
    mev_to_gev: &id001
    - "lep_pt_lead_NOSYS"
    - "lep_pt_sublead_NOSYS"
    - "lep_pt_total_NOSYS"
    - "mll_NOSYS"
    - "mt_ll_NOSYS"
    - "met_met_NOSYS"
  ttbar:
    path: "/home/alaha/local-samples/ml-pytorch-hzyd/ttbar_nn.root"
    label: 0
    mev_to_gev: *id001

#Pytorch    
model:
  model_path: "data/saved_models/mlp_torch/model.pt"
  scaler_path: "data/saved_models/mlp_torch/scaler.npz"

